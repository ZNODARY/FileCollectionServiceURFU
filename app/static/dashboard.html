<!DOCTYPE html>
<html>
<head>
    <title>Дашборд</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
        nav a { display: inline-block; margin: 10px; padding: 10px; background: #f0f0f0; text-decoration: none; color: black; }
        .logout { background: red; color: white; }
        .create-btn { background: green; color: white; padding: 10px 20px; border: none; cursor: pointer; margin: 20px 0; }
        .event-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; margin: 100px auto; padding: 20px; width: 400px; border-radius: 10px; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 28px; cursor: pointer; }
        .close:hover { color: red; }
        input, select, textarea { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>Дашборд</h2>
    <div id="userInfo"></div>
    
    <button id="createEventBtn" class="create-btn">+ Создать мероприятие</button>
    
    <h3>Мои мероприятия</h3>
    <div id="eventsList"></div>
    
    <nav>
        <a href="/my_works.html">Мои работы</a>
        <a href="#" id="logoutBtn" class="logout">Выйти</a>
    </nav>
    
    <!-- Модальное окно -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Создать мероприятие</h3>
            <form id="createEventForm">
                <input type="text" id="title" placeholder="Название" required>
                <textarea id="description" placeholder="Описание"></textarea>
                <select id="eventType">
                    <option value="expert">Экспертная проверка</option>
                    <option value="peer">P2P проверка</option>
                    <option value="voting">Конкурсное голосование</option>
                </select>
                <input type="number" id="timeout" placeholder="Таймаут (часы)" value="48">
                <button type="submit">Создать</button>
            </form>
        </div>
    </div>

    <script>
        async function loadUser() {
            const res = await fetch('/api/auth/me');
            const user = await res.json();
            if (!user.authenticated) window.location.href = '/login.html';
            document.getElementById('userInfo').innerHTML = `<p>Привет, ${user.full_name || user.email} (${user.role})</p>`;
        }
        
        async function loadEvents() {
            const res = await fetch('/api/events/my');
            const events = await res.json();
            const container = document.getElementById('eventsList');
            if (events.length === 0) {
                container.innerHTML = '<p>Нет мероприятий. Создайте первое!</p>';
                return;
            }
            container.innerHTML = events.map(e => `
                <div class="event-card">
                    <strong>${e.title}</strong> (${e.event_type})<br>
                    Статус: ${e.status}
                </div>
            `).join('');
        }
        
        // Модальное окно
        const modal = document.getElementById('eventModal');
        const createBtn = document.getElementById('createEventBtn');
        const closeBtn = document.querySelector('.close');
        
        createBtn.onclick = () => modal.style.display = 'block';
        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };
        
        // Отправка формы
        document.getElementById('createEventForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const res = await fetch('/api/events/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    event_type: document.getElementById('eventType').value,
                    criteria: [],
                    review_timeout_hours: parseInt(document.getElementById('timeout').value) || 48
                })
            });
            
            if (res.ok) {
                modal.style.display = 'none';
                document.getElementById('createEventForm').reset();
                loadEvents();
            } else {
                const err = await res.json();
                alert('Ошибка: ' + (err.detail || 'Неизвестная ошибка'));
            }
        };
        
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', {method: 'POST'});
            window.location.href = '/login.html';
        });
        
        loadUser();
        loadEvents();
    </script>
</body>
</html>
