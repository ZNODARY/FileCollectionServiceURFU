<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <div class="entry">
            <h1 class="entry__title">Регистрация</h1>
            <form id="registerForm">
                <label for="full_name" class="entry__lable">Логин</label>
                <input type="text" id="full_name" name="user_name" required>

                <label for="email" class="entry__lable">email</label>
                <input type="email" id="email" name="user_lg" required>

                <label for="password" class="entry__lable">Пароль</label>
                <input type="password" id="password" name="user_pass" required>

                <label for="password2" class="entry__lable">Подтвердите пароль</label>
                <input type="password" id="password2" name="user_pass2" required>
                
                <div id="error" style="color: red; font-size: 20px; margin-top: 10px;"></div>
                <button type="submit" class="entry__btn">Зарегистрироваться</button>
            </form>
        </div>
    </main>
    <script src="js/register.js"></script>
</body>
</html>
