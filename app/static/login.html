<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <div class="entry">
            <h1 class="entry__title">Вход</h1>
            <form id="loginForm">
                <label for="email" class="entry__lable">Логин</label>
                <input type="email" id="email" name="user_lg" required>

                <label for="password" class="entry__lable">Пароль</label>
                <input type="password" id="password" name="user_pass" required>
                <div id="error" style="color: red; font-size: 20px; margin-top: 10px;"></div>
                <button type="submit" class="entry__btn">Войти</button>
            </form>
            <button type="button" class="entry__btn-reg" id="registerBtn">Регистрация</button>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
